spring.application.name=pdfmedemo
server.port=8080

# ---------- Database ----------
# Defaults match docker-compose.yml. In other environments set DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/procuratio}
spring.datasource.username=${DB_USERNAME:procuratio}
spring.datasource.password=${DB_PASSWORD:procuratio}

# Flyway creates and updates the tables (src/main/resources/db/migration).
# Hibernate only checks that the Java classes match them, and never changes the database itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Frontend access (CORS) ----------
# Comma-separated list of web addresses allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
