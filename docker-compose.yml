# Local PostgreSQL for development.
# Start:  docker compose up -d      Stop: docker compose down
# The data is kept in the "pgdata" volume between restarts.
services:
  postgres:
    image: postgres:16
    container_name: procuratio-postgres
    environment:
      POSTGRES_DB: procuratio
      POSTGRES_USER: procuratio
      POSTGRES_PASSWORD: procuratio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procuratio -d procuratio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
